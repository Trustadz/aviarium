x-app: &app
  image: aviarium:local
  build: .
  environment:
    DATABASE_URL: "${DATABASE_URL:-postgresql://aviarium:aviarium-local@db:5432/aviarium}"
    PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:4173}"
    OIDC_ISSUER: "${OIDC_ISSUER:-}"
    OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
    OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
    OIDC_CALLBACK_URL: "${OIDC_CALLBACK_URL:-}"
  init: true
services:
  db:
    image: postgres:15-bookworm
    environment:
      POSTGRES_USER: aviarium
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-aviarium-local}"
      POSTGRES_DB: aviarium
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviarium -d aviarium"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["node", "dist/apps/server/src/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-4173}:4173"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/health/ready').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
    restart: unless-stopped
  worker:
    <<: *app
    command: ["node", "dist/apps/server/src/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    cpus: 1.0
    mem_limit: 256m
    restart: unless-stopped
  backup:
    <<: *app
    command: ["node", "dist/apps/server/src/backup-runner.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: "${BACKUP_HOST_DIR:-./backup}"
        target: /backup
        bind:
          create_host_path: false
    restart: unless-stopped
volumes:
  pgdata:
