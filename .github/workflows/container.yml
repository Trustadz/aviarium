name: Publish container
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json, without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      version: ${{ inputs.version }}

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: aviarium-production-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish version and latest
        env:
          IMAGE: ghcr.io/trustadz/aviarium
          VERSION: ${{ inputs.version }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ensure_current_main() {
            local current
            current=$(git ls-remote origin refs/heads/main | cut -f1)
            if [[ "$current" != "$GITHUB_SHA" ]]; then
              echo "Main changed after this run started. Run the release again for the new head."
              exit 1
            fi
          }
          ensure_current_main
          tag="v$VERSION"
          existing=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "$tag already belongs to a different commit. Bump the version before publishing."
            exit 1
          fi

          printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if [[ -n "$existing" ]]; then
            docker pull "$IMAGE:$tag"
          else
            docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              -t "$IMAGE:$tag" .
            docker push "$IMAGE:$tag"
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

          ensure_current_main
          docker tag "$IMAGE:$tag" "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Create GitHub Release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$VERSION"
          if release=$(gh release view "$tag" --json isDraft,url); then
            if [[ "$(jq -r '.isDraft' <<< "$release")" == true ]]; then
              gh release edit "$tag" --draft=false --latest
            else
              jq -r '.url' <<< "$release"
            fi
            exit 0
          fi

          previous=$(git tag --merged "$GITHUB_SHA" --sort=-version:refname --list 'v*' |
            awk -v current="$tag" '$0 == current { found=1; next } found && /^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')
          notes=(--generate-notes)
          if [[ -n "$previous" ]]; then
            notes+=(--notes-start-tag "$previous")
          fi
          gh release create "$tag" --verify-tag --latest --title "Aviarium $tag" "${notes[@]}"
