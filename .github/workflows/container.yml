name: Publish container
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: "!startsWith(github.ref, 'refs/tags/')"
      - run: npm run typecheck && npm test
        if: "!startsWith(github.ref, 'refs/tags/')"

      - name: Build image
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          IMAGE: ghcr.io/trustadz/aviarium
        run: |
          docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" -t "$IMAGE:sha-$GITHUB_SHA" .
      - name: Publish private image
        env:
          IMAGE: ghcr.io/trustadz/aviarium
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          case "$GITHUB_REF" in
            refs/heads/main)
              docker push "$IMAGE:sha-$GITHUB_SHA"
              docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:acceptance"
              docker push "$IMAGE:acceptance"
              ;;
            refs/tags/v*)
              docker pull "$IMAGE:sha-$GITHUB_SHA"
              docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:$GITHUB_REF_NAME"
              docker push "$IMAGE:$GITHUB_REF_NAME"
              ;;
          esac
