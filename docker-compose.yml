services:
  app:
    container_name: aviarium
    image: ghcr.io/trustadz/aviarium:latest
    init: true
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-4173}:4173"
    environment:
      HOST: "0.0.0.0"
      APP_BIND: "${APP_BIND:-127.0.0.1}"
      LOGIN_ENABLED: "${LOGIN_ENABLED:-true}"
      AVIARIUM_ENABLED_LOCALES: "${AVIARIUM_ENABLED_LOCALES:-en,nl}"
      AVIARIUM_TRANSLATION_MODEL: "${AVIARIUM_TRANSLATION_MODEL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      TEST_ENVIRONMENT: "${TEST_ENVIRONMENT:-false}"
      DATABASE_URL: "${DATABASE_URL:-}"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: aviarium
      PGPASSWORD: "${POSTGRES_PASSWORD:-aviarium-local}"
      PGDATABASE: aviarium
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:4173}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_CALLBACK_URL: "${OIDC_CALLBACK_URL:-}"
      OIDC_ADMIN_SUBJECT: "${OIDC_ADMIN_SUBJECT:-}"
    volumes:
      - "${BACKUP_STORAGE:-./data/backups}:/backup"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "if (!(await fetch('http://127.0.0.1:4173/health/ready')).ok) process.exit(1)"]
      interval: 10s
      timeout: 4s
      retries: 5
    stop_grace_period: 25s

  db:
    container_name: aviarium-db
    image: postgres:15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: aviarium
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-aviarium-local}"
      POSTGRES_DB: aviarium
    volumes:
      - "${POSTGRES_STORAGE:-./data/postgres}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "aviarium", "-d", "aviarium"]
      interval: 3s
      timeout: 3s
      retries: 15
